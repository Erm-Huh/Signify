<style>
body{margin:0}
a{color:#7d5ba6}a:hover{color:#5e4383}
button{font:inherit;cursor:pointer}
button,a[style*="border-radius"]{transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;will-change:transform}
button:hover,a[style*="border-radius"]:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 16px rgba(125,91,166,.22)}
button:active,a[style*="border-radius"]:active{transform:translateY(1px) scale(.93);box-shadow:0 1px 3px rgba(125,91,166,.2);transition-duration:.08s}
button:focus-visible,a:focus-visible{outline:3px solid #7d5ba6;outline-offset:2px}
@media (prefers-reduced-motion:reduce){button,a[style*="border-radius"]{transition:none}button:hover,button:active,a[style*="border-radius"]:hover,a[style*="border-radius"]:active{transform:none}}
.ph{background-color:#e6f6fa;background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(85,133,100,.10) 10px 11px)}
</style>

<header style="background: rgba(255,255,255,.85); border-bottom: 1px solid #ece6f2">
<div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">

<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 14px; background: linear-gradient(135deg, #8fd9eb, #ffc0cb); display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 7px; box-sizing: border-box"><span style="width: 4px; height: 12px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 18px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 20px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 16px; border-radius: 2px; background: #7d5ba6"></span></span>
<span style="font-weight: 700; font-size: 20px">Signify</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="index.html" aria-current="page" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: #7d5ba6; color: #ffffff; border: 1px solid #7d5ba6;">Home</a>
<a href="visit.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Translate</a>

<a href="how.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">How it works</a>

</div>

<main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 32px">

<section style="display: flex; flex-wrap: wrap; gap: 32px; align-items: center; background: linear-gradient(135deg, #8fd9eb, #ffc0cb); border: none; border-radius: 20px; padding: 48px">
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #555">For clinics and the Deaf patients they serve</span>
<h1 style="margin: 0; font-size: 48px; line-height: 1.05">Nobody should have to wait in a medical emergency.</h1>
<p style="margin: 0; font-size: 18px; color: #444; max-width: 520px; text-align: start">Patients tap the check-in screen. The translater encodes your sign to Text To speech to communicate to your Doctor right away. <br>No more waiting for a remote interpreter for everyday questions.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
<a href="visit.html" style="min-height: 48px; padding: 0 24px; border-radius: 14px; border: 1px solid #7d5ba6; background: #7d5ba6; color: #ffffff; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none">Translate Now</a>
</div>
<span style="font-size: 13px; color: #555">Works on the tablet you already have · nothing recorded · built at HackUMass XIV</span>
</div>
<div style="flex: 1 1 360px; min-width: 0">
<video src="assets/signify-demo.mp4" autoplay muted loop playsinline controls preload="metadata" aria-label="Signify demo: someone signs, captions appear and are spoken aloud" style="display: block; width: 100%; max-height: 420px; border-radius: 16px; background: #2f2f2f; box-shadow: 0 8px 24px rgba(125,91,166,.12)"></video>
</div>
</section>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; text-align: center">
<div><div style="font-size: 32px; font-weight: 700">250 + A–Z</div><div style="color: #444; font-size: 14px">signs and fingerspelled letters</div></div>
<div><div style="font-size: 32px; font-weight: 700">72%</div><div style="color: #444; font-size: 14px">word accuracy on signers it never saw (letters: 93.7%)</div></div>
<div><div style="font-size: 32px; font-weight: 700">~1 s</div><div style="color: #444; font-size: 14px">sign-to-caption latency</div></div>
<div><div style="font-size: 32px; font-weight: 700">$0</div><div style="color: #444; font-size: 14px">new hardware needed</div></div>
</section>

<section style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 24px">Begin Translating in Three simple steps</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 8px"><div aria-hidden="true" style="height: 120px; border-radius: 14px; background: linear-gradient(135deg, #e9f8fc, #fdeef2); border: 1px solid #ece6f2; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; box-sizing: border-box"><div style="position: relative; width: 132px; height: 92px; border-radius: 12px; background: #2f2f2f; box-shadow: 0 0 0 6px rgba(85,133,100,.22), 0 0 30px 2px rgba(85,133,100,.35); border: 1px solid #558564"><svg width="132" height="92" viewBox="0 0 132 92" style="position: absolute; inset: 0"><circle cx="66" cy="40" r="15" fill="#8a7f99"/><path d="M34 92c3-22 16-32 32-32s29 10 32 32z" fill="#8a7f99"/></svg><span style="position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(255,255,255,.95); border-radius: 8px; padding: 2px 8px; display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 20px; color: #7d5ba6">H</strong><span style="font-size: 10px; color: #444">Added ✓</span></span></div></div><strong>1. Sign or tap</strong><span style="color: #444">Say why you're here, your way.</span></div>
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 8px"><div aria-hidden="true" style="height: 120px; border-radius: 14px; background: linear-gradient(135deg, #e9f8fc, #fdeef2); border: 1px solid #ece6f2; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; box-sizing: border-box"><div style="width: 100%; max-width: 230px; display: flex; flex-direction: column; gap: 8px"><div style="background: #ffffff; border: 2px solid #7d5ba6; border-radius: 12px; padding: 8px 10px; font-weight: 700; font-size: 15px">Hello, my name is Maya<span style="display: inline-block; width: 2px; height: 16px; background: #7d5ba6; vertical-align: -3px; margin-left: 2px"></span></div><div style="display: flex; gap: 6px"><span style="padding: 3px 12px; border-radius: 10px; background: #558564; color: #ffffff; font-size: 12px; font-weight: 700">Say it</span><span style="padding: 3px 12px; border-radius: 10px; border: 1px solid #8a7f99; background: #ffffff; font-size: 12px">Undo</span></div></div></div><strong>2. Check it</strong><span style="color: #444">See the English and fix anything before it's sent.</span></div>
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 8px"><div aria-hidden="true" style="height: 120px; border-radius: 14px; background: linear-gradient(135deg, #e9f8fc, #fdeef2); border: 1px solid #ece6f2; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; box-sizing: border-box"><div style="width: 100%; max-width: 240px; display: flex; flex-direction: column; gap: 6px"><span style="align-self: flex-end; background: #7d5ba6; color: #ffffff; padding: 6px 10px; border-radius: 14px 14px 4px 14px; font-size: 13px; font-weight: 600">I’m here for my 2 pm visit.</span><span style="align-self: flex-start; background: #ffffff; border: 1px solid #ece6f2; padding: 6px 10px; border-radius: 14px 14px 14px 4px; font-size: 13px">Welcome! Take a seat, Maya.</span></div></div><strong>3. Be heard</strong><span style="color: #444">The desk reads it, hears it, and replies on screen.</span></div>
</div>
</section>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 32px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<div style="max-width: 640px">
<h2 style="margin: 0; font-size: 24px">Built for clinical use, from Post to Pre medical checks. Classrooms and conversations are next.</h2>
