body{margin:0}
a{color:#7d5ba6}a:hover{color:#5e4383}

</div>

<img src="assets/water-tian.jpg" alt="Photo of Water Tian" style="width: 160px; height: 160px; border-radius: 80px; object-fit: cover; object-position: center 20%; border: 3px solid #8fd9eb; box-sizing: border-box">

</div>
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
<img src="assets/jonathan-olvera.jpg" alt="Photo of Jonathan Olvera" style="width: 160px; height: 160px; border-radius: 80px; object-fit: cover; object-position: center 15%; border: 3px solid #7d5ba6; box-sizing: border-box">

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: -1, sent: false }; }
  renderVals() {
    const s = this.state;
    const road = [
      ['Now', 'Local MVP', '250 signs + A to Z fingerspelling, live captions, natural voice, two-way chat, all running on one laptop', true],
      ['Next', 'Cloud processing', 'Recognition moves to the cloud, so any tablet or phone works with no laptop', false],
      ['Later', 'Full sentences', 'Continuous signing and ASL grammar to English', false],
      ['Vision', 'Everywhere', 'Mobile app and video-call plug-in, co-designed with Deaf users', false]
    ];
    return {
      open1: s.open === 1, btn1: s.open === 1 ? 'Hide what I built' : 'What I built', pick1: () => this.setState({ open: s.open === 1 ? -1 : 1 }),
      open2: s.open === 2, btn2: s.open === 2 ? 'Hide what I built' : 'What I built', pick2: () => this.setState({ open: s.open === 2 ? -1 : 2 }),
      open3: s.open === 3, btn3: s.open === 3 ? 'Hide what I built' : 'What I built', pick3: () => this.setState({ open: s.open === 3 ? -1 : 3 }),
      open4: s.open === 4, btn4: s.open === 4 ? 'Hide what I built' : 'What I built', pick4: () => this.setState({ open: s.open === 4 ? -1 : 4 }),
      roadmap: road.map((r) => ({ when: r[0], title: r[1], body: r[2], style: 'padding: 16px; border-radius: 14px; ' + (r[3] ? 'background: #7d5ba6; color: #ffffff; border: 1px solid #7d5ba6;' : 'background: #ffffff; color: #2f2f2f; border: 1px dashed #558564;') })),
      sent: s.sent, notSent: !s.sent,
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); }
    };
  }
}
window.Component = Component;
</script>
