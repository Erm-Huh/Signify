<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signify: team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7d5ba6}a:hover{color:#5e4383}
button{font:inherit;cursor:pointer}
.ph{background-color:#e6f6fa;background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(85,133,100,.10) 10px 11px)}
</style>
<script src="assets/view.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Page markup (Rev 3 design). {{...}} values come from renderVals() below. -->
<template id="view">
<div style="min-height: 100vh; background: #fbf9fc; color: #2f2f2f; font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5">
<header style="background: rgba(255,255,255,.85); border-bottom: 1px solid #ece6f2">
<div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2f2f2f">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 14px; background: linear-gradient(135deg, #8fd9eb, #ffc0cb); display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 7px; box-sizing: border-box"><span style="width: 4px; height: 12px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 18px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 20px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 16px; border-radius: 2px; background: #7d5ba6"></span></span>
<span style="font-weight: 700; font-size: 20px">Signify</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="index.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Home</a>
<a href="visit.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Translate</a>
<a href="why.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Why it matters</a>
<a href="how.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">How it works</a>
<a href="team.html" aria-current="page" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: #7d5ba6; color: #ffffff; border: 1px solid #7d5ba6;">Team</a>
</nav>
</div>
</header>
<main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 32px">

<section style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 32px">The team</h1>
<p style="margin: 4px 0 0; color: #444">[N] people, [N] hours, built at [HACKATHON NAME] · [DATE]</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="https://github.com/Erm-Huh/Signify" style="min-height: 48px; padding: 0 24px; border-radius: 14px; border: 1px solid #7d5ba6; background: #7d5ba6; color: #ffffff; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none">GitHub</a>
<a href="#devpost" style="min-height: 48px; padding: 0 24px; border-radius: 14px; border: 1px solid #7d5ba6; background: #ffffff; color: #2f2f2f; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none">Devpost</a>
<a href="index.html" style="min-height: 48px; padding: 0 24px; border-radius: 14px; border: 1px solid #7d5ba6; background: #ffffff; color: #2f2f2f; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none">Demo video</a>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<sc-for list="{{team}}" as="m" hint-placeholder-count="4">
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
<div class="ph" style="width: 72px; height: 72px; border: 1px dashed #558564; border-radius: 36px"></div>
<strong style="font-size: 18px">{{m.name}}</strong>
<span style="color: #444; font-size: 14px">{{m.role}}</span>
<button type="button" onClick="{{m.pick}}" aria-expanded="{{m.open}}" style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #8a7f99; background: #ffffff; color: #2f2f2f">{{m.btn}}</button>
<sc-if value="{{m.open}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 14px; color: #444">{{m.built}}</p></sc-if>
<div style="display: flex; gap: 12px; font-size: 14px"><a href="https://github.com/Erm-Huh/Signify">GitHub</a><a href="#linkedin">LinkedIn</a></div>
</div>
</sc-for>
</div>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 20px">Roadmap</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{roadmap}}" as="r" hint-placeholder-count="4">
<div style="{{r.style}}">
<span style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; opacity: .8">{{r.when}}</span>
<strong style="display: block; margin-top: 4px">{{r.title}}</strong>
<span style="display: block; font-size: 14px; margin-top: 4px; opacity: .85">{{r.body}}</span>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 340px; background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 20px">Thanks to</h2>
<ul style="margin: 0; padding-left: 20px; color: #444">
<li>ASL Citizen dataset (Microsoft Research) [CONFIRM CITATION]</li>
<li>[Deaf community members / ASL teachers who gave feedback]</li>
<li>[Mentors, sponsors, organizers]</li>
</ul>
</div>
<form onSubmit="{{submit}}" style="flex: 1 1 340px; background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 20px">Get in touch</h2>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 12px; border: 1px solid #7d5ba6; border-radius: 8px">Thanks! (Wireframe only, nothing was sent.)</p></sc-if>
<sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
<label for="em" style="font-size: 14px; font-weight: 600">Email</label>
<input id="em" type="email" placeholder="you@example.com" style="min-height: 44px; border: 1px solid #8a7f99; border-radius: 8px; padding: 0 12px; font: inherit">
<label for="msg" style="font-size: 14px; font-weight: 600">Message</label>
<textarea id="msg" rows="3" placeholder="Feedback, or want to pilot Signify?" style="border: 1px solid #8a7f99; border-radius: 8px; padding: 10px 12px; font: inherit"></textarea>
<button type="submit" style="min-height: 48px; padding: 0 24px; border-radius: 14px; border: 1px solid #7d5ba6; background: #7d5ba6; color: #ffffff; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; align-self: flex-start">Send</button>
</sc-if>
</form>
</section>
</main>
<footer style="border-top: 1px solid #ece6f2; background: #ffffff">
<div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: #555">
<span>Signify, a hackathon project · <a href="https://github.com/Erm-Huh/Signify">GitHub</a> · [DEVPOST LINK]</span>
<span>Brand layout v0.1</span>
</div>
</footer>
</div>
</template>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: -1, sent: false }; }
  renderVals() {
    const s = this.state;
    const team = [
      ['[NAME]', 'Frontend & brand', '[What you built: UI, design system, landing page]'],
      ['[NAME]', 'ML & recognition', '[What they built: model training, inference]'],
      ['[NAME]', 'Backend & integration', '[What they built: pipeline, speech]'],
      ['[NAME]', 'Research & pitch', '[What they did: user interviews, demo, video]']
    ];
    const road = [
      ['Now', 'Hackathon MVP', '[N] isolated signs, live captions, speech, two-way chat', true],
      ['Next', 'Fingerspelling', 'Spell names and places letter by letter', false],
      ['Later', 'Full sentences', 'Continuous signing and ASL grammar to English', false],
      ['Vision', 'Everywhere', 'Mobile app and video-call plug-in, co-designed with Deaf users', false]
    ];
    return {
      team: team.map((m, i) => ({ name: m[0], role: m[1], built: m[2], open: s.open === i, btn: s.open === i ? 'Hide what I built' : 'What I built', pick: () => this.setState({ open: s.open === i ? -1 : i }) })),
      roadmap: road.map((r) => ({ when: r[0], title: r[1], body: r[2], style: 'padding: 16px; border-radius: 14px; ' + (r[3] ? 'background: #7d5ba6; color: #ffffff; border: 1px solid #7d5ba6;' : 'background: #ffffff; color: #2f2f2f; border: 1px dashed #558564;') })),
      sent: s.sent, notSent: !s.sent,
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); }
    };
  }
}
window.Component = Component;
</script>
</body>
</html>
