<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px"><div style="font-size: 36px; font-weight: 700">50 : 1</div><p style="margin: 4px 0 0; color: #444">ASL users per certified interpreter in the U.S. (~10,000 certified interpreters)</p><span style="font-size: 12px; color: #555">Source: Registry of Interpreters for the Deaf (RID)</span></div>

</div>
<div style="flex: 1 1 340px; background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px">What we heard</h2>

<section style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 340px; background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 10px">

<div style="border: 2px solid #558564; border-radius: 8px; padding: 10px"><strong>Signify</strong><br><span style="color: #444">Open a link. Done.</span></div>

<div style="flex: 1 1 340px; background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 20px">For organizations</h2>
<ul style="margin: 0; padding-left: 20px; color: #444">

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sc: 0, open: 0 }; }
  renderVals() {
    const s = this.state;
    const data = [
      ['Check-in', 'A Deaf patient writes symptoms on a clipboard while the line grows, and details get lost before triage.', 'They sign or tap at the kiosk, confirm the English, and the desk hears it and replies on screen.'],
      ['Waiting room', 'Their name gets called out loud, and they miss it.', '[PLACEHOLDER] Their turn shows on their screen, with a gentle vibration on their phone.'],
      ['Pharmacy pickup', 'Notes go back and forth about the dosage, and they leave unsure.', 'The question is signed, captioned and spoken, and the pharmacist\u2019s answer is shown in plain English.'],
      ['Classroom (next)', '[PLACEHOLDER] Questions held back until after class.', '[PLACEHOLDER] Raise hand, sign it, and the room hears it.']
    ];
    const pr = [
      ['Signer first', 'The signer is the speaker. Signify is just the bridge.'],
      ['Supports interpreters', 'For check-in and everyday questions. Diagnosis, consent and complex care still call for a certified medical interpreter, and Signify can request one.'],
      ['Private by default', 'Video is processed on the device and never stored, which matters for patient privacy (HIPAA).'],
      ['Built with the community', '[PLAN] Feedback from Deaf users shapes what we build next.']
    ];
    const tab = (a) => 'min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; ' + (a ? 'background: #7d5ba6; color: #ffffff; border: 1px solid #7d5ba6;' : 'background: #ffffff; color: #2f2f2f; border: 1px solid #8a7f99;');
    return {
      scenarios: data.map((d, i) => ({ label: d[0], active: s.sc === i, style: tab(s.sc === i), pick: () => this.setState({ sc: i }) })),
      before: data[s.sc][1], after: data[s.sc][2],
      principles: pr.map((p, i) => ({ title: p[0], body: p[1], open: s.open === i, sign: s.open === i ? '−' : '+', pick: () => this.setState({ open: s.open === i ? -1 : i }) }))
    };
  }
}
window.Component = Component;
</script>
