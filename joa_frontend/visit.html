<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signify: your visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7d5ba6}a:hover{color:#5e4383}
button{font:inherit;cursor:pointer}
button,a[style*="border-radius"]{transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;will-change:transform}
button:hover,a[style*="border-radius"]:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 16px rgba(125,91,166,.22)}
button:active,a[style*="border-radius"]:active{transform:translateY(1px) scale(.93);box-shadow:0 1px 3px rgba(125,91,166,.2);transition-duration:.08s}
button:focus-visible,a:focus-visible{outline:3px solid #7d5ba6;outline-offset:2px}
@media (prefers-reduced-motion:reduce){button,a[style*="border-radius"]{transition:none}button:hover,button:active,a[style*="border-radius"]:hover,a[style*="border-radius"]:active{transform:none}}
.ph{background-color:#e6f6fa;background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(85,133,100,.10) 10px 11px)}
</style>
<script src="assets/view.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Page markup (Rev 3 design, wireframe V4). {{...}} values come from renderVals() below. -->
<template id="view">
<div style="min-height: 100vh; background: #fbf9fc; color: #2f2f2f; font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5">
<header style="background: rgba(255,255,255,.85); border-bottom: 1px solid #ece6f2">
<div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2f2f2f">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 14px; background: linear-gradient(135deg, #8fd9eb, #ffc0cb); display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 7px; box-sizing: border-box"><span style="width: 4px; height: 12px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 18px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 20px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 16px; border-radius: 2px; background: #7d5ba6"></span></span>
<span style="font-weight: 700; font-size: 20px">Signify</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="index.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Home</a>
<a href="visit.html" aria-current="page" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: #7d5ba6; color: #ffffff; border: 1px solid #7d5ba6;">Translate</a>
<a href="why.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Why it matters</a>
<a href="how.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">How it works</a>
<a href="team.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Team</a>
</nav>
</div>
</header>
<main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<span style="font-size: 13px; font-weight: 600; color: #558564">● Your information is safe · Nothing is recorded</span>
<h1 style="margin: 6px 0 0; font-size: 36px; font-weight: 600">Your visit, in your own language</h1>
<p style="margin: 4px 0 0; color: #444; max-width: 680px">From the front desk to the nurse to checkout, one screen goes with you. Sign or tap, and everyone you meet reads and hears you.</p>
</div>

</div>

<div style="display: contents"><sc-if value="{{urgent}}" hint-placeholder-val="{{false}}">
<div role="alert" style="background: #ffc0cb; color: #2f2f2f; border-radius: 16px; padding: 16px 20px; font-size: 18px; font-weight: 600">Staff have been alerted and are coming to you now.</div>
</sc-if></div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<section aria-label="You" style="flex: 5 1 720px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #e9f8fc, #fff0f3)">
<div style="display: flex; align-items: center; gap: 12px">
<span class="ph" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; flex: none"></span>
<div><span style="display: block; font-size: 12px; font-weight: 600; color: #444">YOU'RE TALKING WITH</span><strong style="font-size: 20px">{{whoLabel}}</strong>
<sc-if value="{{nameCaught}}" hint-placeholder-val="{{false}}"><span style="display: block; margin-top: 4px; font-size: 12px; font-weight: 600; color: #2f2f2f">✓ Name caught from what they said</span></sc-if>
<sc-if value="{{nameMissing}}" hint-placeholder-val="{{true}}"><span style="display: block; margin-top: 4px; font-size: 12px; color: #444">Name not caught yet. It shows here when they introduce themselves.</span></sc-if></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start; max-width: 340px">
<span style="font-size: 14px; color: #444">{{stopHint}}</span>
<button type="button" onClick="{{startEdit}}" style="min-height: 40px; padding: 0 14px; border-radius: 14px; border: 1px solid #8a7f99; background: #ffffff; font-size: 13px; color: #2f2f2f">Fix name</button>
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
<form onSubmit="{{saveName}}" style="display: flex; gap: 8px; align-items: center">
<label for="nameFix" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Their name</label>
<input id="nameFix" value="{{nameDraft}}" onChange="{{onNameDraft}}" placeholder="e.g. Dr. Patel" style="min-width: 0; min-height: 40px; border: 1px solid #8a7f99; border-radius: 14px; padding: 0 12px; font: inherit">
<button type="submit" style="min-height: 40px; padding: 0 14px; border-radius: 14px; border: 1px solid #2f2f2f; background: #2f2f2f; color: #ffffff; font-weight: 600">Save</button>
</form>
</sc-if>
</div>
</div>

<div style="display: contents"><sc-if value="{{isWaiting}}" hint-placeholder-val="{{false}}">
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center">
<div style="flex: 1 1 200px"><span style="font-size: 12px; font-weight: 600; color: #444">YOUR PLACE IN LINE</span><div style="font-size: 56px; font-weight: 700; color: #7d5ba6; line-height: 1">{{queuePos}}</div><span style="color: #444">About {{queueMin}} min [ESTIMATE]</span></div>
<div style="flex: 2 1 280px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px">No need to listen for your name. When it's your turn, this screen lights up and your phone buzzes [PLACEHOLDER].</span>
<button type="button" onClick="{{callMe}}" style="min-height: 48px; padding: 0 20px; border-radius: 14px; border: none; background: #558564; color: #ffffff; font-weight: 700; align-self: flex-start">Demo: nurse calls you</button>
</div>
</div>
</sc-if></div>

<div style="display: contents"><sc-if value="{{isDoctor}}" hint-placeholder-val="{{false}}">
<div role="note" style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border: 2px solid #ffc0cb">
<span style="font-size: 15px; max-width: 560px">For diagnosis, treatment choices or consent, a <strong>certified medical interpreter</strong> is your right. Signify helps with everything in between.</span>
<button type="button" onClick="{{requestInterp}}" style="min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid #7d5ba6; background: #ffffff; color: #7d5ba6; font-weight: 700">{{interpLabel}}</button>
</div>
</sc-if></div>

<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between">
<span role="status" style="{{healthStyle}}">{{healthLabel}}</span>
<button type="button" onClick="{{toggleSettings}}" aria-expanded="{{settingsExpanded}}" style="min-height: 40px; padding: 0 12px; border-radius: 14px; border: 1px solid #8a7f99; background: #ffffff; font-size: 13px; color: #2f2f2f">Settings</button>
</div>
<div style="display: contents"><sc-if value="{{settingsOpen}}">
<form onSubmit="{{saveSettings}}" style="background: #f3eefa; border-radius: 16px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; flex: 1 1 240px">Backend URL<input type="url" value="{{apiDraft}}" onChange="{{onApiDraft}}" spellcheck="false" style="min-height: 44px; border: 1px solid #8a7f99; border-radius: 14px; padding: 0 12px; font: inherit; font-weight: 400"></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 44px"><input type="checkbox" checked="{{demoDraft}}" onChange="{{toggleDemoDraft}}" style="width: 20px; height: 20px; accent-color: #7d5ba6"> Demo mode (simulated signs and speech, no backend)</label>
<button type="submit" style="min-height: 44px; padding: 0 18px; border-radius: 14px; border: none; background: #7d5ba6; color: #ffffff; font-weight: 700">Save</button>
</form>
</sc-if></div>
<div class="ph" style="{{camStyle}}">
<video id="preview" autoplay muted playsinline aria-label="Your camera" style="{{videoStyle}}"></video>
<sc-if value="{{camPrompt}}"><div style="position: relative; text-align: center; color: #444; font-size: 18px; font-weight: 600; padding: 16px; max-width: 420px">{{camPromptText}}</div></sc-if>
<sc-if value="{{showOverlay}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 16px; right: 16px; bottom: 16px; background: rgba(255,255,255,.95); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 24px rgba(47,47,47,.12)">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 64px; font-weight: 700; color: #7d5ba6; line-height: 1">{{liveWord}}</span><span style="font-size: 13px; color: #444">{{holdLabel}}</span></div>
<div style="height: 8px; background: #ece6f2; border-radius: 4px; overflow: hidden"><div style="{{holdStyle}}"></div></div>
</div>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<sc-if value="{{isDemo}}"><button type="button" onClick="{{toggleRun}}" style="{{runStyle}}">{{runLabel}}</button></sc-if>
<sc-if value="{{isLive}}">
<button type="button" onClick="{{toggleCam}}" style="{{camBtnStyle}}">{{camBtnLabel}}</button>
<button type="button" onClick="{{record}}" disabled="{{recDisabled}}" style="{{recStyle}}">{{recLabel}}</button>
<label style="position: relative; overflow: hidden; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid #7d5ba6; background: #ffffff; color: #7d5ba6; font-weight: 600; display: inline-flex; align-items: center; cursor: pointer">Upload a clip<input type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm" onChange="{{onFile}}" aria-label="Upload a video clip of one sign" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"></label>
</sc-if>
<span style="font-size: 14px; color: #444">{{signHint}}</span>
</div>
<div aria-live="polite" style="{{statusStyle}}">{{statusText}}</div>
<div aria-live="polite" style="display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="0"><button type="button" onClick="{{c.fix}}" aria-label="{{c.aria}}" style="{{c.style}}">{{c.word}}</button></sc-for>
</div>
<div style="display: contents"><sc-if value="{{picking}}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="font-size: 14px; color: #444">Did you mean:</span>
<sc-for list="{{altChoices}}" as="a"><button type="button" onClick="{{a.pick}}" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #7d5ba6; background: #ffffff; color: #7d5ba6; font-weight: 600">{{a.label}}</button></sc-for>
</div>
</sc-if></div>
<sc-if value="{{hasDraft}}" hint-placeholder-val="{{false}}">
<div style="background: #f3eefa; border-radius: 16px; padding: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between">
<div style="font-size: 28px; font-weight: 600; line-height: 1.25">{{draftEnglish}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-if value="{{isLive}}"><button type="button" onClick="{{sendSigned}}" style="min-height: 48px; padding: 0 22px; border-radius: 14px; border: none; background: #558564; color: #ffffff; font-weight: 700; font-size: 16px">Say it</button>
<button type="button" onClick="{{undo}}" style="min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid #8a7f99; background: #ffffff; color: #2f2f2f">Undo</button></sc-if>
<button type="button" onClick="{{clearSigns}}" style="min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid #8a7f99; background: #ffffff; color: #2f2f2f">Start over</button>
</div>
</div>
</sc-if>
</div>

<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Or tap to say</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{phrases}}" as="q" hint-placeholder-count="4"><button type="button" onClick="{{q.say}}" style="min-height: 48px; padding: 0 16px; border-radius: 24px; border: 1px solid #7d5ba6; background: #ffffff; color: #7d5ba6; font-weight: 600; font-size: 15px">{{q.label}}</button></sc-for>
</div>
<sc-if value="{{showPain}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
<span style="font-weight: 600">Pain level</span>
<div role="group" aria-label="Pain level 0 to 10" style="display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{pain}}" as="p" hint-placeholder-count="11"><button type="button" onClick="{{p.pick}}" aria-label="{{p.aria}}" style="min-height: 44px; border-radius: 14px; font-weight: 700; border: 1px solid #8a7f99; background: #ffffff; color: #2f2f2f">{{p.n}}</button></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #444"><span>No pain</span><span>Worst pain</span></div>
</div>
</sc-if>
</div>
</section>

<aside style="flex: 2 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Conversation · {{stopName}}</h2>
<button type="button" onClick="{{toggleFlip}}" aria-pressed="{{flipped}}" style="min-height: 40px; padding: 0 12px; border-radius: 14px; border: 1px solid #8a7f99; background: #ffffff; font-size: 13px; color: #2f2f2f">{{flipLabel}}</button>
</div>
<div style="{{threadStyle}}">
<sc-if value="{{noThread}}" hint-placeholder-val="{{true}}"><p style="margin: 0; color: #444; font-size: 14px">Sign or tap to start. What you say appears here, big enough for {{whoShort}} to read.</p></sc-if>
<sc-for list="{{thread}}" as="m" hint-placeholder-count="0">
<div style="{{m.style}}"><span style="display: block; font-size: 12px; font-weight: 600; opacity: .8">{{m.who}}</span>{{m.text}}</div>
</sc-for>
</div>
<div style="background: #fff0f3; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<div><span style="display: block; font-size: 12px; font-weight: 600; color: #444">FOR THE SPEAKER</span><strong style="font-size: 16px">Talk to the patient</strong></div>
<button type="button" onClick="{{toggleListen}}" aria-pressed="{{listening}}" style="{{listenStyle}}">{{listenLabel}}</button>
</div>
<sc-if value="{{listening}}" hint-placeholder-val="{{false}}"><div role="status" aria-live="polite" style="font-size: 26px; font-weight: 600; line-height: 1.25; background: #ffffff; border-radius: 12px; padding: 12px; min-height: 40px">{{heard}}</div></sc-if>
<span style="font-size: 13px; color: #444">{{listenHint}}</span>
</div>
</div>

<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Your voice (text to speech)</h2>
<span style="font-size: 12px; padding: 2px 10px; border-radius: 14px; background: #ffc0cb">Browser voice</span>
</div>
<div role="group" aria-label="Voice" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{voices}}" as="v" hint-placeholder-count="3"><button type="button" onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="{{v.style}}"><strong style="display: block">{{v.label}}</strong><span style="font-size: 12px">{{v.desc}}</span></button></sc-for>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 60px">Speed</span><input type="range" min="1" max="5" value="{{speed}}" onChange="{{setSpeed}}" style="flex: 1; accent-color: #7d5ba6"><span style="width: 60px">{{speedLabel}}</span></label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 60px">Volume</span><input type="range" min="1" max="5" value="{{vol}}" onChange="{{setVol}}" style="flex: 1; accent-color: #7d5ba6"><span style="width: 60px">{{volLabel}}</span></label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" checked="{{autoSpeak}}" onChange="{{toggleAuto}}" style="width: 20px; height: 20px; accent-color: #7d5ba6"><span>Speak out loud when I send</span></label>
<sc-if value="{{speaking}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; align-items: center; gap: 10px; background: #f3eefa; border-radius: 14px; padding: 10px 14px; font-size: 14px">
<span aria-hidden="true" style="display: flex; gap: 3px; align-items: flex-end; height: 18px"><span style="width: 4px; height: 8px; background: #7d5ba6; border-radius: 2px"></span><span style="width: 4px; height: 16px; background: #7d5ba6; border-radius: 2px"></span><span style="width: 4px; height: 11px; background: #7d5ba6; border-radius: 2px"></span><span style="width: 4px; height: 18px; background: #7d5ba6; border-radius: 2px"></span></span>
<span>Speaking: “{{nowSaying}}”</span></div>
</sc-if>
</div>
</aside>
</div>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600">Your visit so far</h2>
<button type="button" onClick="{{copySummary}}" style="min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid #8a7f99; background: #ffffff; color: #2f2f2f">{{copyLabel}}</button>
</div>
<sc-if value="{{noLog}}" hint-placeholder-val="{{true}}"><p style="margin: 0; color: #444">Everything said at each stop is kept here, so you never have to repeat yourself. [CONFIRM: cleared when the visit ends]</p></sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{log}}" as="g" hint-placeholder-count="0">
<div style="border: 1px solid #ece6f2; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
<strong style="color: #7d5ba6">{{g.stop}}</strong>
<sc-for list="{{g.lines}}" as="l" hint-placeholder-count="1"><span style="font-size: 14px"><strong>{{l.who}}:</strong> {{l.text}}</span></sc-for>
</div>
</sc-for>
</div>
</section>
</main>
<footer style="border-top: 1px solid #ece6f2; background: #ffffff">
<div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: #555">
<span>Signify, a hackathon project · <a href="https://github.com/Erm-Huh/Signify">GitHub</a> · [DEVPOST LINK]</span>
<span>Clinical revision v0.3</span>
</div>
</footer>
</div>
</template>

<script>
// Live mode talks to the SignBridge backend (water_backend/): record ~3 s or upload a clip -> POST /predict.
// Speech uses the browser for now (speechSynthesis + SpeechRecognition); ElevenLabs will replace say() and listen*().
// Demo mode keeps the original canvas simulation (no backend, sample speech).

  /* ---------- speech (browser text to speech) ---------- */

    if (!this.state.auto || !t) return;
    if (this.sayT) clearTimeout(this.sayT);

    this.setState({ health: 'wait' });

      const r = await fetch(this.state.api + '/health');

  }

      toggleCam: () => this.toggleCam(), camBtnLabel: s.camOn ? 'Turn off camera' : 'Turn on camera', camBtnStyle: btn(!s.camOn, false),
      record: () => this.record(), recDisabled: !s.camOn || s.busy, recLabel: s.recording ? 'Stop' : 'Record a sign',
      recStyle: s.recording ? 'min-height: 48px; padding: 0 22px; border-radius: 14px; font-weight: 700; background: #ffc0cb; color: ' + GR + '; border: 1px solid #ffc0cb;' : btn(s.camOn, !s.camOn || s.busy),
      onFile: (e) => { const f = e.target.files && e.target.files[0]; if (f) this.predict(f, f.name); e.target.value = ''; },
      signHint: live ? 'One sign per clip, about 3 seconds. Then press “Say it”.' : 'Just sign. It speaks out loud the moment you finish.',
      statusText: s.status ? s.status.text : '',
      statusStyle: !s.status ? 'min-height: 0' : s.status.kind === 'error'
        ? 'color: #8a2a3a; background: #fff0f3; padding: 10px 14px; border-radius: 14px; font-weight: 600; font-size: 15px'
        : 'color: #2f2f2f; font-weight: 600; font-size: 15px',
      picking: !!(pickChip && pickChip.alts && pickChip.alts.length),
      altChoices: pickChip && pickChip.alts ? pickChip.alts.map((a) => ({ label: a.label.toUpperCase() + ' · ' + pct(a.confidence),
        pick: () => { const cs = s.chips.slice(); cs[s.picking] = Object.assign({}, pickChip, { word: a.label.toUpperCase(), unsure: false, conf: a.confidence }); this.setState({ chips: cs, picking: null, status: null }); } })) : [],
      toggleRun: () => { if (s.running) { this.stop(); this.setState({ running: false }); } else { if (done) this.setState({ chips: [] }); this.setState({ running: true }); this.timer = setInterval(() => this.tick(), 200); } },
      runLabel: s.running ? 'Pause' : (done ? 'Sign something else' : (n ? 'Keep signing' : 'Start signing')),
      runStyle: 'min-height: 48px; padding: 0 22px; border-radius: 14px; font-weight: 600; ' + (s.running ? 'background: #ffffff; color: ' + LIL + '; border: 1px solid ' + LIL + ';' : 'background: ' + LIL + '; color: #ffffff; border: 1px solid ' + LIL + ';'),
      chips: s.chips.map((c, i) => ({ word: c.word,
        aria: c.alts ? c.word + (c.unsure ? ', unsure' : '') + '. Tap to choose another guess' : (c.unsure ? c.word + ', unsure. Tap to change to ' + c.alt : c.word),
        style: 'min-height: 44px; padding: 0 16px; border-radius: 22px; font-weight: 700; ' + (c.unsure ? 'background: #ffffff; color: ' + GR + '; border: 2px dashed ' + LIL + ';' : 'background: #e9f8fc; color: ' + GR + '; border: 2px solid ' + BLUE + ';') +
          (s.picking === i ? ' box-shadow: 0 0 0 4px #f3eefa;' : ''),
        fix: () => { if (c.alts) { this.setState({ picking: s.picking === i ? null : i }); return; } if (!c.unsure) return; const cs = s.chips.slice(); cs[i] = { word: c.alt, alt: c.word, unsure: false }; this.setState({ chips: cs }); } })),
      hasDraft: n > 0, draftEnglish: draftEnglish,
      sendSigned: () => { this.stop(); this.patientSays(draftEnglish.replace(/…$/, '.')); this.setState({ chips: [], running: false, picking: null, last: null, status: null }); },
      undo: () => this.setState({ chips: s.chips.slice(0, -1), picking: null }),
      clearSigns: () => { this.stop(); this.setState({ chips: [], running: false, picking: null, last: null, status: null }); },
      phrases: st.phrases.map((p) => ({ label: p, say: () => this.patientSays(p) })),
      pain: Array.from({ length: 11 }, (_, i) => ({ n: i, aria: 'Pain ' + i + ' of 10', pick: () => this.patientSays('My pain is ' + i + ' out of 10.') })),
      thread: s.threads[s.stop].map((m) => ({ who: m.who, text: m.text,
        style: 'max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 18px; line-height: 1.35; ' + (m.mine ? 'align-self: flex-start; background: ' + LIL + '; color: #ffffff;' : (m.who === 'System' ? 'align-self: center; background: #eaf4ee; color: ' + GR + '; font-size: 14px;' : 'align-self: flex-end; background: ' + PINK + '; color: ' + GR + ';')) })),
      noThread: s.threads[s.stop].length === 0,
      threadStyle: 'display: flex; flex-direction: column; gap: 8px; min-height: 200px; max-height: 360px; overflow-y: auto; background: #fbf9fc; border-radius: 14px; padding: 12px; transition: transform .3s; ' + (s.flipped ? 'transform: rotate(180deg);' : ''),
      flipped: s.flipped, toggleFlip: () => this.setState({ flipped: !s.flipped }), flipLabel: s.flipped ? 'Unflip' : 'Flip for staff',
      replies: st.replies.map((t) => ({ label: t, send: () => this.push(st.who, t, false) })),
      draft: s.draft, onDraft: (e) => this.setState({ draft: e.target.value }),
      reply: (e) => { e.preventDefault(); const t = s.draft.trim(); if (t) { this.push(st.who, t, false); this.setState({ draft: '' }); } },
      voices: voices.map((v, i) => ({ label: v[0], desc: v[1], on: s.voice === i, pick: () => this.setState({ voice: i }),
        style: 'min-height: 60px; padding: 8px; border-radius: 14px; text-align: left; ' + pill(s.voice === i) })),
      speed: s.speed, setSpeed: (e) => this.setState({ speed: Number(e.target.value) }), speedLabel: sp[s.speed - 1],
      vol: s.vol, setVol: (e) => this.setState({ vol: Number(e.target.value) }), volLabel: vl[s.vol - 1],
      autoSpeak: s.auto, toggleAuto: () => this.setState({ auto: !s.auto }),
      speaking: !!s.saying, nowSaying: s.saying,
      listening: s.listening, heard: s.heard, toggleListen: () => this.toggleListen(),
      listenLabel: s.listening ? 'Stop listening' : 'Tap to speak',
      listenHint: s.listenError ? s.listenError : live
        ? 'Tap, then speak. Tap again when done. Your words show up as large text for the patient.'
        : 'Tap, then speak. Your words show up as large text for the patient. [DEMO: plays sample speech]',
      listenStyle: 'min-height: 48px; padding: 0 20px; border-radius: 24px; font-weight: 700; ' + (s.listening ? 'background: #ffffff; color: ' + GR + '; border: 2px solid ' + GR + ';' : 'background: ' + GR + '; color: #ffffff; border: 2px solid ' + GR + ';'),
      log: log, noLog: log.length === 0,
      copyLabel: s.copied ? 'Copied ✓' : 'Copy visit summary',
      copySummary: () => { const t = (nameFor ? 'Talking with: ' + nameFor + ' (' + st.who + ')\n\n' : '') + log.map((g) => g.stop + '\n' + g.lines.map((l) => l.who + ': ' + l.text).join('\n')).join('\n\n');
        try { if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {}); } catch (e) {} this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1500); }
    };
  }
}
window.Component = Component;
</script>
