<style>
body{margin:0}
a{color:#7d5ba6}a:hover{color:#5e4383}
button{font:inherit;cursor:pointer}
button,a[style*="border-radius"]{transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;will-change:transform}
button:hover,a[style*="border-radius"]:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 16px rgba(125,91,166,.22)}
button:active,a[style*="border-radius"]:active{transform:translateY(1px) scale(.93);box-shadow:0 1px 3px rgba(125,91,166,.2);transition-duration:.08s}
button:focus-visible,a:focus-visible{outline:3px solid #7d5ba6;outline-offset:2px}
@media (prefers-reduced-motion:reduce){button,a[style*="border-radius"]{transition:none}button:hover,button:active,a[style*="border-radius"]:hover,a[style*="border-radius"]:active{transform:none}}
.ph{background-color:#e6f6fa;background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(85,133,100,.10) 10px 11px)}
.eq span{display:inline-block;width:6px;border-radius:3px;background:#7d5ba6;transform-origin:bottom;animation:eqb .9s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.15s}.eq span:nth-child(3){animation-delay:.3s}.eq span:nth-child(4){animation-delay:.45s}.eq span:nth-child(5){animation-delay:.6s}
@keyframes eqb{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.eq span{animation:none}}
</style>

<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between"><p style="margin: 0; color: #444; max-width: 720px">From webcam to spoken words in about a second. The steps play on their own; click one to stop and read it.</p><button type="button" onClick="{{toggleAuto}}" aria-pressed="{{autoOn}}" style="min-height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid #8a7f99; background: #ffffff; color: #2f2f2f; font-size: 14px; font-weight: 600">{{autoLabel}}</button></div>

 stroke-width="2"/><circle cx="100" cy="52" r="4" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="2"/><circle cx="100" cy="28" r="5" fill="#ffffff" stroke="#7d5ba6" stroke-width="2"/><circle cx="121" cy="114" r="4" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="2"/><circle cx="125" cy="84" r="4" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="2"/><circle cx="127" cy="60" r="4" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="2"/><circle cx="129" cy="40" r="5" fill="#ffffff" stroke="#7d5ba6" stroke-width="2"/><circle cx="140" cy="124" r="4" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="2"/><circle cx="150" cy="102" r="4" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="2"/><circle cx="156" cy="86" r="4" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="2"/><circle cx="160" cy="70" r="5" fill="#ffffff" stroke="#7d5ba6" stroke-width="2"/></svg><span style="display: block; font-size: 12px; color: #444; text-align: center">21 hand landmarks, plus body and lips for words</span></div></sc-if>

round: #ffffff; border: 1px solid #ece6f2; border-radius: 6px"><div style="width: 9%; height: 100%; background: #ffc0cb; border-radius: 6px"></div><div style="position: absolute; top: -4px; bottom: -4px; left: 75%; width: 2px; background: #2f2f2f"></div></div><span style="color: #444">0.09</span></div></div></sc-if>

radius: 8px; font-weight: 700">A</span><span style="width: 26px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #ece6f2; border-radius: 8px; font-weight: 700">M</span><span style="width: 26px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #ece6f2; border-radius: 8px; font-weight: 700">E</span></div><span style="font-size: 12px; color: #444">↓ smart spacing</span><strong style="font-size: 24px; letter-spacing: .02em">HELLO MY NAME</strong></div></sc-if>

<div style="flex: 2 1 320px; display: flex; flex-direction: column; gap: 8px">

<p style="margin: 0; color: #444">{{stepBody}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{stepTech}}" as="t" hint-placeholder-count="2"><span style="font-size: 13px; padding: 4px 10px; border: 1px solid #8a7f99; border-radius: 14px">{{t.name}}</span></sc-for>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px">ASL is its own language</h2>
<p style="margin: 0; color: #444">Sign order follows ASL grammar, not English. Signify shows both, so signers can trust what's being said for them.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<div style="flex: 1 1 260px; border: 1px dashed #558564; border-radius: 14px; padding: 16px"><span style="font-size: 12px; font-weight: 600; color: #555">GLOSS</span><div style="font-family: ui-monospace, Menlo, monospace; font-size: 20px">HEAD PAIN TWO DAY</div></div>
<span aria-hidden="true" style="font-size: 24px">→</span>
<div style="flex: 1 1 260px; border: 2px solid #558564; border-radius: 14px; padding: 16px"><span style="font-size: 12px; font-weight: 600; color: #555">ENGLISH</span><div style="font-size: 20px; font-weight: 700">I've had a headache for two days.</div></div>
</div>
</section>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 20px">Frontend ↔ model contract</h2>
<p style="margin: 0; color: #444">The local app streams this to the page about 30 times a second over a WebSocket, alongside the camera frames.</p>
<pre style="margin: 0; padding: 16px; background: #7d5ba6; color: #ffffff; border-radius: 14px; overflow-x: auto; font-size: 14px">{ "type": "state", "mode": "auto", "kind": "word", "label": "PAIN",
  "stable": true, "word": { "label": "PAIN", "confidence": 0.91 },
  "letter": { ... }, "text": "MY HEAD PAIN", "paused": false }</pre>
<span style="font-size: 13px; color: #555">Field names from the bridge in Blake_frontend/server/ws_bridge.py.</span>
</section>
<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px">Architecture</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px">
<span style="padding: 14px 16px; border: 1px solid #ece6f2; border-radius: 12px; background: #f6f2fb">Webcam</span><span aria-hidden="true">→</span>
<span style="padding: 14px 16px; border: 1px solid #ece6f2; border-radius: 12px; background: #f6f2fb">Hand / pose landmarks (MediaPipe)</span><span aria-hidden="true">→</span>
<span style="padding: 14px 16px; border: 1px solid #ece6f2; border-radius: 12px; background: #f6f2fb">Word + letter models (local)</span><span aria-hidden="true">→</span>
<span style="padding: 14px 16px; border: 1px solid #ece6f2; border-radius: 12px; background: #f6f2fb">Sentence + smart spacing</span><span aria-hidden="true">→</span>
<span style="padding: 14px 16px; border: 1px solid #ece6f2; border-radius: 12px; background: #f6f2fb">Captions + natural voice</span>
</div>
<span style="font-size: 13px; color: #555">Today it all runs locally on one laptop. The only thing sent out is the text being spoken, which goes to ElevenLabs for the voice. As Signify grows, recognition moves to cloud processing so any tablet or phone can use it with no laptop.</span>
</section>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div><h2 style="margin: 0; font-size: 20px">Under the hood, live</h2>
<p style="margin: 4px 0 0; color: #444; max-width: 760px">The raw engineering view of the same webcam feed: the 21 hand landmarks MediaPipe tracks, the skeleton image the letter model classifies, both models' scores against their confidence bars, the router's decision, and every message the backend sends. It needs the Signify bridge running on this laptop.</p></div>
</div>
<signify-hood></signify-hood>
</section>

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px"><div style="font-size: 32px; font-weight: 700">72.1%</div><p style="margin: 4px 0 0; color: #444">Top-1 accuracy on 250 signs (88.1% top-5)</p><span style="font-size: 12px; color: #555">Test set: 14,396 clips from 3 signers held out of training. Letters A–Z: 93.7%</span></div>

<script>
const STEP_MS = 6000, TICK_MS = 100;
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 0, open: 0, auto: true, t: 0 }; }
  // The five steps play in a loop; clicking one stops on it so it can be read.
  componentDidMount() {
    this.loop = setInterval(() => {
      const s = this.state;
      if (!s.auto || document.hidden) return;
      if (s.t + TICK_MS >= STEP_MS) this.setState({ t: 0, step: (s.step + 1) % 5 });
      else this.setState({ t: s.t + TICK_MS });
    }, TICK_MS);
  }
  componentWillUnmount() { clearInterval(this.loop); }
  renderVals() {
    const s = this.state;
    const steps = [
      ['Capture', 'The Signify app on the laptop reads the webcam frame by frame and streams it to the page, so you see exactly what the model sees.', ['OpenCV', 'WebSockets']],
      ['Detect hands', 'Hand and body landmarks are tracked to describe each sign’s handshape, position and motion.', ['MediaPipe']],
      ['Recognize', 'Two models run side by side: a word model for 250 signs and a letter model for A to Z fingerspelling. Nothing is shown until a model is confident.', ['Transformer on landmarks (ONNX Runtime)', 'asl-signs dataset', 'Letter classifier']],
      ['Build the sentence', 'Signs and letters go into an editable sentence. Smart spacing splits fingerspelled letters into words, and lowering your hand ends a word. Turning ASL grammar into natural English is next on our roadmap.', ['Smart spacing', 'Editable text']],
      ['Speak', 'The sentence is shown in large type and read aloud in a natural voice. Staff reply by typing or speaking, and Signify picks up who is talking (doctor, nurse) from what they say.', ['ElevenLabs', 'Web Speech API']]
    ];
    const story = [
      ['Challenges we ran into', 'Letters that share a handshape (M, N, S, T) getting confused, predictions flickering frame to frame, and keeping everything real time. Confidence gates fixed the flicker: nothing shows until the model is sure.'],
      ['Accomplishments we’re proud of', 'Words and fingerspelling running live together, a natural voice, two-way conversation that knows when the doctor or nurse is talking, and a one-tap camera privacy pause.'],
      ['What we learned', 'ASL is its own language with its own grammar, not word-for-word English. And an honest test on signers the model never saw matters more than a big number.'],
      ['What’s next', 'Cloud processing so any tablet or phone works with no laptop, more signs, continuous sentences with ASL grammar, and a mobile app.']
    ];
    const card = (a) => 'text-align: left; min-height: 88px; padding: 16px; border-radius: 16px; ' + (a ? 'background: #7d5ba6; color: #ffffff; border: 1px solid #7d5ba6;' : 'background: #ffffff; color: #2f2f2f; border: 1px solid #8a7f99;');
    return {
      steps: steps.map((d, i) => ({ n: i + 1, title: d[0], active: s.step === i, style: card(s.step === i),
        bar: 'display: block; height: 3px; margin-top: 10px; border-radius: 2px; background: rgba(255,255,255,.85); transition: width .1s linear; width: ' +
          (s.step === i ? (s.auto ? Math.round((s.t / STEP_MS) * 100) : 100) : 0) + '%;' + (s.step === i ? '' : ' opacity: 0;'),
        pick: () => this.setState({ step: i, auto: false, t: 0 }) })),
      vis: { s0: s.step === 0, s1: s.step === 1, s2: s.step === 2, s3: s.step === 3, s4: s.step === 4 },
      autoOn: s.auto ? 'true' : 'false', autoLabel: s.auto ? '❚❚ Pause tour' : '▶ Play tour',
      toggleAuto: () => this.setState({ auto: !s.auto, t: 0 }),
      stepTitle: steps[s.step][0], stepBody: steps[s.step][1],
      stepTech: steps[s.step][2].map((n) => ({ name: n })),
      stack: ['HTML / CSS / JS', 'Python', 'MediaPipe', 'ONNX Runtime', 'OpenCV', 'WebSockets', 'ElevenLabs', 'Web Speech API', 'asl-signs dataset', 'GitHub Pages'].map((n) => ({ name: n })),
      story: story.map((d, i) => ({ title: d[0], body: d[1], open: s.open === i, sign: s.open === i ? '−' : '+', pick: () => this.setState({ open: s.open === i ? -1 : i }) }))
    };
  }
}
window.Component = Component;
</script>
<script>
// Under the hood, live: the raw backend view of the bridge (webcam, landmarks, both models,
// router, text buffer, raw messages). A custom element with its own shadow DOM, so the
// page's template re-renders (view.js) never touch its live canvas and panels.
function signifyHood(host, root) {
  const $ = (id) => root.getElementById(id);
  const params = new URLSearchParams(location.search);
  let url = params.get('ws');
  if (!url) { try { url = localStorage.getItem('signify.ws'); } catch (e) {} }
  url = url || 'ws://localhost:8765';
  $('url').textContent = url;

  const HAND = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  const cam = $('cam'), ctx = cam.getContext('2d');
  let ws = null, last = null, frameImg = null, frameCount = 0, lastKind = null, lastRaw = 0, paused = false;

  const log = (html) => {
    const el = $('log'), d = document.createElement('div');
    d.innerHTML = '<span class="dim">' + new Date().toLocaleTimeString() + '</span> ' + html;
    el.prepend(d);
    while (el.childNodes.length > 80) el.removeChild(el.lastChild);
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  function bars(el, top, thr, color, n) {
    const rows = [];
    for (let i = 0; i < n; i++) {
      const t = top[i];
      const lab = t ? t[0] : '·', v = t ? t[1] : 0;
      rows.push('<div class="bar"><span class="lab">' + esc(lab) + '</span><div class="track"><div class="fill" style="width:' +
        Math.min(100, v * 100).toFixed(1) + '%;background:' + (v >= thr ? 'var(--ok)' : color) + '"></div><div class="thr" style="left:' +
        (thr * 100) + '%"></div></div><span class="num">' + v.toFixed(3) + '</span></div>');
    }
    el.innerHTML = rows.join('');
  }
  const flags = (el, list) => { el.innerHTML = list.map(([name, on, warn]) => '<span class="flag ' + (on ? (warn ? 'warn' : 'on') : '') + '">' + name + '</span>').join(''); };
  const stage = (id, live, text) => { $(id).classList.toggle('live', !!live); $(id.replace(/^s/, 'v')).textContent = text; };

  function draw() {
    if (!host.isConnected) return;
    requestAnimationFrame(draw);
    if (!frameImg) return;
    if (cam.width !== frameImg.width || cam.height !== frameImg.height) { cam.width = frameImg.width; cam.height = frameImg.height; }
    ctx.drawImage(frameImg, 0, 0);
    const L = last && last.debug && last.debug.letter;
    const pts = L && L.points;
    if (pts && pts.length === 21 && !paused) {
      const W = cam.width, H = cam.height;
      let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
      ctx.strokeStyle = 'rgba(255,192,203,.95)'; ctx.lineWidth = Math.max(2, W / 260); ctx.setLineDash([6, 4]);
      ctx.strokeRect(x0 * W - 10, y0 * H - 10, (x1 - x0) * W + 20, (y1 - y0) * H + 20); ctx.setLineDash([]);
      ctx.strokeStyle = '#8fd9eb'; ctx.lineWidth = Math.max(2, W / 220);
      ctx.beginPath();
      for (const [a, b] of HAND) { ctx.moveTo(pts[a][0] * W, pts[a][1] * H); ctx.lineTo(pts[b][0] * W, pts[b][1] * H); }
      ctx.stroke();
      pts.forEach(([x, y], i) => { ctx.fillStyle = i % 4 === 0 ? '#ffffff' : '#c9b3ea'; ctx.beginPath(); ctx.arc(x * W, y * H, Math.max(3, W / 150), 0, 7); ctx.fill(); });
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x0 * W - 10, y0 * H - 34, 190, 22);
      ctx.fillStyle = '#ffb3c6'; ctx.font = '14px ui-monospace,Consolas,monospace';
      ctx.fillText('hand · 21 landmarks', x0 * W - 4, y0 * H - 18);
    }
  }
  requestAnimationFrame(draw);

  function onState(s) {
    last = s;
    paused = !!s.paused;
    $('camMsg').hidden = !paused && frameImg !== null;
    if (paused) { $('camMsg').hidden = false; $('camMsg').innerHTML = '<div>Camera paused for privacy (webcam released by the bridge).</div><div>Press “resume camera” above.</div>'; }
    $('bPause').textContent = paused ? 'resume camera' : 'pause camera';
    $('fps').textContent = s.fps != null ? s.fps : '–';
    $('mode').textContent = s.mode || '–';
    $('src').textContent = s.source != null ? s.source : '–';
    const d = s.debug || {}, L = d.letter, W = d.word;

    stage('sCam', !paused, paused ? 'paused (released)' : (d.frame ? d.frame[0] + '×' + d.frame[1] + ' @ ' + s.fps + ' fps' : '–'));
    stage('sMp', L && L.hand, L && L.hand ? 'hand found · 21 pts' : 'no hand');
    stage('sLet', L && L.passes, L ? (L.best || '–') + ' ' + (L.conf || 0).toFixed(2) + ' · ' + L.infer_ms + ' ms' : 'waiting');
    stage('sWord', W && W.state === 'sign', W ? W.state + (W.label ? ' · ' + W.label + ' ' + W.conf.toFixed(2) : '') : 'waiting');
    stage('sRouter', s.kind === 'WORD' || s.kind === 'LETTER', (s.kind || '–') + (s.label ? ' · ' + s.label : ''));
    const lastCommit = s.commits && s.commits.length ? s.commits[s.commits.length - 1] : null;
    stage('sText', !!lastCommit, lastCommit ? '+ ' + lastCommit.label : (s.text ? '“' + s.text.slice(-24) + '”' : 'empty'));

    $('hud').hidden = paused;
    $('hud').textContent = (s.kind || '') + (s.label ? ' → ' + s.label : '') + (s.stable ? ' (stable)' : '');
    $('decision').innerHTML = '<span class="k">' + esc(s.kind || '–') + '</span>' + esc(s.label || '') + (s.stable ? ' <span class="dim">stable</span>' : '');
    $('reason').textContent = 'router: ' + (s.reason || '–') + (s.alternatives && s.alternatives.length ? '  · alternatives: ' + s.alternatives.map((a) => a.join(':')).join(', ') : '');
    $('text').textContent = s.text || ' ';

    if (L) {
      bars($('letterBars'), L.top || [], 0.75, 'var(--letter)', 3);
      $('letterProg').style.width = Math.round((L.progress || 0) * 100) + '%';
      flags($('letterFlags'), [['hand', L.hand], ['≥ 0.75', L.passes], ['moving', L.moving, true], ['stable', L.stable],
        ['J/Z motion → ' + (L.motion_override || '–'), !!L.motion_override, true], ['infer ' + L.infer_ms + ' ms', false]]);
    }
    if (d.skeleton) $('skel').src = 'data:image/jpeg;base64,' + d.skeleton;
    if (W) {
      bars($('wordBars'), W.top || [], 0.29, 'var(--word)', 5);
      flags($('wordFlags'), [['state: ' + W.state, W.state === 'sign'], ['stable', W.stable], ['recent: ' + ((W.recent || []).join(' ') || '–'), false]]);
      $('wordReason').textContent = 'word model: ' + (W.reason || '–');
    }

    for (const c of s.commits || []) log('<b class="' + (c.kind === 'WORD' ? 'w' : 'l') + '">+' + esc(c.kind) + ' ' + esc(c.label) + '</b> → “' + esc(s.text) + '”');
    if (s.kind !== lastKind) { log('router ' + esc(lastKind || '–') + ' → <b>' + esc(s.kind) + '</b>' + (s.label ? ' ' + esc(s.label) : '')); lastKind = s.kind; }

    const now = performance.now();
    if (now - lastRaw > 333) {
      lastRaw = now;
      const copy = JSON.parse(JSON.stringify(s));
      if (copy.debug && copy.debug.skeleton) copy.debug.skeleton = '<jpeg base64, ' + copy.debug.skeleton.length + ' chars>';
      if (copy.debug && copy.debug.letter && copy.debug.letter.points) copy.debug.letter.points = '[21 × [x, y]] ' + JSON.stringify(copy.debug.letter.points.slice(0, 2)) + ' …';
      $('raw').textContent = JSON.stringify(copy, null, 2);
    }
  }

  function connect() {
    $('conn').textContent = 'connecting'; $('dot').classList.remove('on');
    try { ws = new WebSocket(url); } catch (e) { setTimeout(connect, 2000); return; }
    ws.binaryType = 'blob';
    ws.onopen = () => { $('conn').textContent = 'connected'; $('dot').classList.add('on'); send({ type: 'debug', on: true }); log('connected to ' + esc(url)); };
    ws.onmessage = async (ev) => {
      if (typeof ev.data !== 'string') {
        frameCount++;
        if (paused) return;
        try { const bmp = await createImageBitmap(ev.data); if (frameImg && frameImg.close) frameImg.close(); frameImg = bmp; } catch (e) {}
        return;
      }
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === 'state') onState(m);
      else if (m.type === 'hello') log('bridge hello · text to speech: ' + esc(m.tts || 'browser fallback (no ElevenLabs key)'));
      else if (m.type === 'error' || m.type === 'warn') log('<span style="color:var(--bad)">' + esc(m.type + ': ' + m.error) + '</span>');
    };
    ws.onclose = () => { if (!host.isConnected) return; $('conn').textContent = 'disconnected · retrying'; $('dot').classList.remove('on'); setTimeout(connect, 2000); };
  }
  setInterval(() => { $('ffps').textContent = frameCount; frameCount = 0; }, 1000);
  $('bMode').onclick = () => send({ type: 'cmd', cmd: 'mode' });
  $('bClear').onclick = () => send({ type: 'cmd', cmd: 'clear' });
  $('bPause').onclick = () => send({ type: 'cmd', cmd: paused ? 'resume' : 'pause' });
  connect();
}
