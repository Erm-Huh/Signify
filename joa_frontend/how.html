<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signify: how it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7d5ba6}a:hover{color:#5e4383}
button{font:inherit;cursor:pointer}
button,a[style*="border-radius"]{transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;will-change:transform}
button:hover,a[style*="border-radius"]:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 16px rgba(125,91,166,.22)}
button:active,a[style*="border-radius"]:active{transform:translateY(1px) scale(.93);box-shadow:0 1px 3px rgba(125,91,166,.2);transition-duration:.08s}
button:focus-visible,a:focus-visible{outline:3px solid #7d5ba6;outline-offset:2px}
@media (prefers-reduced-motion:reduce){button,a[style*="border-radius"]{transition:none}button:hover,button:active,a[style*="border-radius"]:hover,a[style*="border-radius"]:active{transform:none}}
.ph{background-color:#e6f6fa;background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(85,133,100,.10) 10px 11px)}
</style>
<script src="assets/view.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Page markup (Rev 3 design, wireframe V4). {{...}} values come from renderVals() below. -->
<template id="view">
<div style="min-height: 100vh; background: #fbf9fc; color: #2f2f2f; font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5">
<header style="background: rgba(255,255,255,.85); border-bottom: 1px solid #ece6f2">
<div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2f2f2f">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 14px; background: linear-gradient(135deg, #8fd9eb, #ffc0cb); display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 7px; box-sizing: border-box"><span style="width: 4px; height: 12px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 18px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 20px; border-radius: 2px; background: #7d5ba6"></span><span style="width: 4px; height: 16px; border-radius: 2px; background: #7d5ba6"></span></span>
<span style="font-weight: 700; font-size: 20px">Signify</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="index.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Home</a>
<a href="visit.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Translate</a>
<a href="why.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Why it matters</a>
<a href="how.html" aria-current="page" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: #7d5ba6; color: #ffffff; border: 1px solid #7d5ba6;">How it works</a>
<a href="team.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none; background: transparent; color: #2f2f2f; border: 1px solid transparent;">Team</a>
</nav>
</div>
</header>
<main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 32px">

<section style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 32px">How it works</h1>
<p style="margin: 0; color: #444; max-width: 720px">From webcam to spoken words in under [X] ms. Click each step.</p>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
<button type="button" onClick="{{st.pick}}" aria-pressed="{{st.active}}" style="{{st.style}}">
<span style="display: block; font-size: 13px; opacity: .8">Step {{st.n}}</span>
<span style="display: block; font-size: 18px; font-weight: 700">{{st.title}}</span>
</button>
</sc-for>
</div>
<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center">
<div class="ph" style="flex: 1 1 300px; height: 220px; border: 1px dashed #558564; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #444; font-size: 14px; text-align: center; padding: 12px">DIAGRAM / GIF: {{stepTitle}}</div>
<div style="flex: 2 1 320px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 22px">{{stepTitle}}</h2>
<p style="margin: 0; color: #444">{{stepBody}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{stepTech}}" as="t" hint-placeholder-count="2"><span style="font-size: 13px; padding: 4px 10px; border: 1px solid #8a7f99; border-radius: 14px">{{t.name}}</span></sc-for>
</div>
</div>
</section>


<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px">ASL is its own language</h2>
<p style="margin: 0; color: #444">Sign order follows ASL grammar, not English. Signify shows both, so signers can trust what's being said for them.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<div style="flex: 1 1 260px; border: 1px dashed #558564; border-radius: 14px; padding: 16px"><span style="font-size: 12px; font-weight: 600; color: #555">GLOSS</span><div style="font-family: ui-monospace, Menlo, monospace; font-size: 20px">HEAD PAIN TWO DAY</div></div>
<span aria-hidden="true" style="font-size: 24px">→</span>
<div style="flex: 1 1 260px; border: 2px solid #558564; border-radius: 14px; padding: 16px"><span style="font-size: 12px; font-weight: 600; color: #555">ENGLISH</span><div style="font-size: 20px; font-weight: 700">I've had a headache for two days.</div></div>
</div>
</section>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 20px">Frontend ↔ model contract</h2>
<p style="margin: 0; color: #444">Agreed early so the UI can be built on mock data while the model trains.</p>
<pre style="margin: 0; padding: 16px; background: #7d5ba6; color: #ffffff; border-radius: 14px; overflow-x: auto; font-size: 14px">{ "live_sign": "PAIN", "confidence": 0.91, "hold": 0.6,
  "gloss": ["HEAD", "PAIN"], "english": null, "landmarks": [...] }</pre>
<span style="font-size: 13px; color: #555">[BACKEND TEAM: confirm field names]</span>
</section>
<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px">Architecture</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px">
<span class="ph" style="padding: 14px 16px; border: 1px dashed #558564; border-radius: 8px">Browser: webcam</span><span aria-hidden="true">→</span>
<span class="ph" style="padding: 14px 16px; border: 1px dashed #558564; border-radius: 8px">Hand / pose landmarks</span><span aria-hidden="true">→</span>
<span class="ph" style="padding: 14px 16px; border: 1px dashed #558564; border-radius: 8px">Sign classifier [WHERE IT RUNS]</span><span aria-hidden="true">→</span>
<span class="ph" style="padding: 14px 16px; border: 1px dashed #558564; border-radius: 8px">Gloss → English</span><span aria-hidden="true">→</span>
<span class="ph" style="padding: 14px 16px; border: 1px dashed #558564; border-radius: 8px">Captions + text-to-speech</span>
</div>
<span style="font-size: 13px; color: #555">[BACKEND TEAM: confirm each box and whether anything runs on a server]</span>
</section>

<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px"><div style="font-size: 32px; font-weight: 700">[X]%</div><p style="margin: 4px 0 0; color: #444">Top-1 accuracy on [N] signs</p><span style="font-size: 12px; color: #555">Test set: [DATASET SPLIT]</span></div>
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px"><div style="font-size: 32px; font-weight: 700">[X] ms</div><p style="margin: 4px 0 0; color: #444">Average sign-to-caption time</p><span style="font-size: 12px; color: #555">Measured on [LAPTOP]</span></div>
<div style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px"><div style="font-size: 32px; font-weight: 700">[N]</div><p style="margin: 4px 0 0; color: #444">Training videos used</p><span style="font-size: 12px; color: #555">From ASL Citizen [CONFIRM]</span></div>
</section>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px">Built with</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{stack}}" as="t" hint-placeholder-count="8"><span style="font-size: 14px; padding: 6px 12px; border: 1px solid #8a7f99; border-radius: 16px">{{t.name}}</span></sc-for>
</div>
</section>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 8px; font-size: 20px">The build story</h2>
<sc-for list="{{story}}" as="q" hint-placeholder-count="4">
<div style="border: 1px solid #e6dff0; border-radius: 14px">
<button type="button" onClick="{{q.pick}}" aria-expanded="{{q.open}}" style="width: 100%; min-height: 52px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; background: transparent; border: none; color: #2f2f2f; font-weight: 600; text-align: left">
<span>{{q.title}}</span><span aria-hidden="true">{{q.sign}}</span></button>
<sc-if value="{{q.open}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 0 16px 16px; color: #444">{{q.body}}</p></sc-if>
</div>
</sc-for>
</section>

<section style="background: #ffffff; border: 1px solid #ece6f2; border-radius: 20px; box-shadow: 0 1px 2px rgba(47,47,47,.04), 0 8px 24px rgba(125,91,166,.06); padding: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<div><h2 style="margin: 0; font-size: 20px">Privacy</h2><p style="margin: 4px 0 0; color: #444">[CONFIRM] Video never leaves your device. Nothing is recorded or stored.</p></div>
<a href="https://github.com/Erm-Huh/Signify" style="min-height: 48px; padding: 0 24px; border-radius: 14px; border: 1px solid #7d5ba6; background: #ffffff; color: #2f2f2f; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none">Read the code</a>
</section>
</main>
<footer style="border-top: 1px solid #ece6f2; background: #ffffff">
<div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: #555">
<span>Signify, a hackathon project · <a href="https://github.com/Erm-Huh/Signify">GitHub</a> · [DEVPOST LINK]</span>
<span>Brand layout v0.1</span>
</div>
</footer>
</div>
</template>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 0, open: 0 }; }
  renderVals() {
    const s = this.state;
    const steps = [
      ['Capture', 'The webcam is read frame by frame in the browser. Nothing to install.', ['getUserMedia', 'Canvas']],
      ['Detect hands', 'Hand and body landmarks are tracked to describe each sign’s handshape, position and motion.', ['[e.g. MediaPipe]']],
      ['Recognize', 'A model trained on isolated ASL signs predicts the most likely sign and a confidence score.', ['[MODEL]', 'ASL Citizen dataset']],
      ['Translate grammar', 'ASL has its own grammar, so it isn\u2019t word-for-word English. Raw signs (gloss) like HEAD PAIN TWO DAY are turned into natural English. Both are shown so nothing is hidden.', ['[e.g. small language model / rules]']],
      ['Speak', 'The sentence is shown in large type and read aloud. Staff can reply by typing or speaking.', ['Web Speech API']]
    ];
    const story = [
      ['Challenges we ran into', '[e.g. similar handshapes getting confused, lighting, real-time speed in the browser]'],
      ['Accomplishments we’re proud of', '[e.g. live recognition running at N fps, two-way conversation working end to end]'],
      ['What we learned', '[e.g. ASL grammar is not word-for-word English; what Deaf users told us]'],
      ['What’s next', '[e.g. more signs, fingerspelling, continuous sentences, mobile, ASL-to-ASL avatar replies]']
    ];
    const card = (a) => 'text-align: left; min-height: 88px; padding: 16px; border-radius: 16px; ' + (a ? 'background: #7d5ba6; color: #ffffff; border: 1px solid #7d5ba6;' : 'background: #ffffff; color: #2f2f2f; border: 1px solid #8a7f99;');
    return {
      steps: steps.map((d, i) => ({ n: i + 1, title: d[0], active: s.step === i, style: card(s.step === i), pick: () => this.setState({ step: i }) })),
      stepTitle: steps[s.step][0], stepBody: steps[s.step][1],
      stepTech: steps[s.step][2].map((n) => ({ name: n })),
      stack: ['HTML / CSS / JS', '[FRAMEWORK]', '[e.g. MediaPipe]', '[ML LIBRARY]', 'Web Speech API', 'ASL Citizen', 'GitHub Pages', '[OTHER]'].map((n) => ({ name: n })),
      story: story.map((d, i) => ({ title: d[0], body: d[1], open: s.open === i, sign: s.open === i ? '−' : '+', pick: () => this.setState({ open: s.open === i ? -1 : i }) }))
    };
  }
}
window.Component = Component;
</script>
</body>
</html>
